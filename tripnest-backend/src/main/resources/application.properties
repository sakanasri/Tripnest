spring.application.name=tripnest-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tripnest
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Saki@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate PostgreSQL Dialect & Schema Auto-Update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8081

# JWT Configuration
jwt.secret=TripNestSecretKeyTripNestSecretKey123456789
jwt.expiration=86400000

# AI Configuration (Gemini / Configurable AI)
tripnest.ai.provider=gemini
tripnest.ai.api-key=${GEMINI_API_KEY:}
tripnest.ai.model=${GEMINI_MODEL:gemini-1.5-flash}